# Master Publication Tables Specification (Phase 6)
experiment_name: "master_tables_specification"
description: "Specifications and column layouts for the 6 canonical publication tables"

tables:
  - id: "table1"
    name: "cross_domain_discrimination"
    title: "Table 1: Primary Cross-Domain Discrimination & Generalization Gap"
    description: "In-domain vs. cross-domain AUROC and AUPRC with patient-clustered 95% CIs across DenseNet121 and EfficientNet-B0"
    columns:
      - "Architecture"
      - "Evaluation Direction"
      - "Setting"
      - "Pneumonia AUROC [95% CI]"
      - "Pneumonia AUPRC [95% CI]"
      - "Sens @ 90% Spec"
      - "Generalization Gap (Delta AUROC)"
      - "p-value (Raw)"
      - "q-value (FDR)"

  - id: "table2"
    name: "calibration_regimes_and_oracle_recovery"
    title: "Table 2: 4-Regime Probability Calibration & Oracle Recalibration"
    description: "Expected Calibration Error (ECE) and Brier scores across in-domain, uncalibrated, temperature-scaled, and oracle-recalibrated regimes"
    columns:
      - "Architecture"
      - "Shift Direction"
      - "Calibration Regime"
      - "ECE (Equal-Width) [95% CI]"
      - "ECE (Adaptive)"
      - "Brier Score"
      - "NLL"
      - "Calibration Recovery (%)"

  - id: "table3"
    name: "decision_threshold_transfer"
    title: "Table 3: Source-Optimal Decision Threshold Transfer Breakdown"
    description: "Clinical discordance, operating point sensitivity, specificity, and F1 degradation under transferred vs oracle thresholds"
    columns:
      - "Architecture"
      - "Source Domain"
      - "Target Domain"
      - "Threshold Policy"
      - "Operating Threshold (tau)"
      - "Target Sensitivity"
      - "Target Specificity"
      - "Target F1 Score"
      - "Absolute F1 Drop"

  - id: "table4"
    name: "architecture_and_uncertainty_ablations"
    title: "Table 4: Architecture & CheXpert Uncertainty Policy Ablations"
    description: "Multi-seed replication (seeds 42, 1337, 2024) across DenseNet121 and EfficientNet-B0 and CheXpert uncertainty policies (U-Zeros, U-Ones, U-Ignore)"
    columns:
      - "Architecture"
      - "Uncertainty Policy"
      - "In-Domain AUROC (mean +- std)"
      - "Cross-Domain AUROC (mean +- std)"
      - "Over-Prediction Ratio"
      - "Specificity Collapse (%)"
      - "Probe AUROC"

  - id: "table5"
    name: "explainability_and_shortcuts_audit"
    title: "Table 5: Explainability Saliency Audit, Faithfulness & Shortcut Quantification"
    description: "Grad-CAM deletion/insertion dynamics, Adebayo parameter randomization sanity checks, BBox pointing game, and peripheral shortcut energy"
    columns:
      - "Architecture"
      - "Domain Setting"
      - "Insertion AUC"
      - "Deletion AUC"
      - "Faithfulness Ratio (FDR)"
      - "Adebayo Sanity Drop (%)"
      - "Pointing Game Hit Rate (%)"
      - "Energy in BBox (%)"
      - "Peripheral Shortcut Ratio (%)"

  - id: "table6"
    name: "hypothesis_testing_summary"
    title: "Table 6: Consolidated Hypothesis Testing & Significance Summary"
    description: "Formal empirical hypothesis test results with raw p-values and Benjamini-Hochberg FDR-adjusted q-values"
    columns:
      - "Hypothesis ID"
      - "Research Question"
      - "Null Hypothesis (H0)"
      - "Statistical Test"
      - "Effect Size / Difference"
      - "Raw p-value"
      - "FDR q-value"
      - "Significance Verdict (alpha=0.05)"

