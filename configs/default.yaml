# Base PneumoShift Configuration
project_name: "PneumoShift"
seed: 42
seeds: [42, 1337, 2024]

data:
  dataset_name: "nih" # "nih" or "chexpert"
  data_dir: "data/nih_cxr"
  splits_dir: "data/splits"
  image_size: 224
  channels: 3
  batch_size: 32
  num_workers: 4
  uncertainty_policy: "u_zeros" # "u_zeros", "u_ones", "u_ignore"
  shared_classes:
    - "Atelectasis"
    - "Cardiomegaly"
    - "Consolidation"
    - "Edema"
    - "Pleural Effusion"
    - "Pneumonia"
    - "Pneumothorax"
    - "No Finding"
  headline_target: "Pneumonia"
  use_frontal_only: true
  cache_preprocessed: false

model:
  architecture: "densenet121" # "densenet121" or "efficientnet_b0"
  pretrained: true
  num_classes: 8
  dropout: 0.2
  pooling: "avg"

train:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adamw" # "adam", "adamw"
  lr_scheduler: "plateau" # "plateau", "cosine"
  lr_patience: 2
  lr_factor: 0.5
  early_stopping_patience: 6
  mixed_precision: true
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  pos_weight: "inverse_freq" # "inverse_freq", "none"
  two_stage_finetune: false
  freeze_epochs: 3

eval:
  batch_size: 64
  num_workers: 4
  bootstrap_samples: 1000
  confidence_level: 0.95
  ece_bins: 15
  ece_bin_strategy: "uniform" # "uniform", "adaptive"
  threshold_selection_metric: "youden" # "youden", "f1", "fixed_sens_90"
  run_oracle_recalibration: true

xai:
  method: "gradcam"
  target_layer: "features.norm5" # denseblock4/norm5 for densenet, conv_head for efficientnet
  deletion_steps: 10
  insertion_steps: 10
  perturbation_rotation: 10
  perturbation_brightness: 0.1
  sanity_check_layers: ["classifier", "features.denseblock4", "all"]

