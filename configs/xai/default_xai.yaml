method: "gradcam"
target_layer: "features.norm5"
secondary_method: "gradcam_plus_plus"
faithfulness:
  deletion_steps: 10
  insertion_steps: 10
  step_size_percent: 5
stability:
  num_perturbations: 10
  rotation_degrees: 5
  brightness_factor: 0.1
sanity_checks:
  randomize_layers: ["classifier", "features.denseblock4", "all"]
localization:
  bbox_csv: "data/nih_cxr/BBox_List_2017.csv"
  iou_thresholds: [0.1, 0.3, 0.5]
shortcut_analysis:
  border_margin_percent: 0.05
  corner_margin_percent: 0.08
  device_mask_enabled: true
output_dir: "results/figures/xai"

