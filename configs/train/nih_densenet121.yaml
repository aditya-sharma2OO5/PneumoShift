# Experiment Configuration: In-Domain Baseline DenseNet121 on NIH ChestX-ray14
experiment_name: "nih_densenet121_baseline"
project_name: "PneumoShift"
seed: 42
seeds: [42, 1337, 2024]

data:
  dataset_name: "nih"
  data_dir: "data/nih_cxr"
  images_dir: "data/nih_cxr/images"
  splits_dir: "data/splits/nih"
  image_size: 224
  channels: 3
  batch_size: 32
  num_workers: 4
  use_frontal_only: true
  cache_preprocessed: false
  cache_dir: "data/cache/nih"
  uncertainty_policy: "binary"
  shared_classes:
    - "Atelectasis"
    - "Cardiomegaly"
    - "Consolidation"
    - "Edema"
    - "Pleural Effusion"
    - "Pneumonia"
    - "Pneumothorax"
    - "No Finding"
  headline_target: "Pneumonia"
  headline_only: false

model:
  architecture: "densenet121"
  pretrained: true
  num_classes: 8
  dropout: 0.2
  pooling: "avg"
  target_layer: "features.norm5"

train:
  epochs: 20
  learning_rate: 0.0001 # 1e-4 as reported in Pan et al. (2019)
  weight_decay: 0.00001 # 1e-5
  optimizer: "adamw"
  lr_scheduler: "plateau"
  lr_patience: 2
  lr_factor: 0.5
  early_stopping_patience: 6
  mixed_precision: true
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  pos_weight: "inverse_freq"
  two_stage_finetune: false
  freeze_epochs: 3
  checkpoint_dir: "results/runs/nih_densenet121/checkpoints"
  run_output_dir: "results/runs/nih_densenet121"
  save_best_metric: "val_macro_auroc"
  save_headline_metric: "val_pneumonia_auroc"

eval:
  batch_size: 64
  num_workers: 4
  bootstrap_samples: 1000
  confidence_level: 0.95
  ece_bins: 15
  ece_bin_strategy: "uniform"
  threshold_selection_metric: "youden"
  run_oracle_recalibration: true
  target_calibration_ratio: 0.10
  output_dir: "results/tables/nih_densenet121"

xai:
  method: "gradcam"
  target_layer: "features.norm5"
  deletion_steps: 10
  insertion_steps: 10
  perturbation_rotation: 10
  perturbation_brightness: 0.1
  sanity_check_layers: ["classifier", "features.denseblock4", "all"]
  output_dir: "results/figures/nih_densenet121/xai"

