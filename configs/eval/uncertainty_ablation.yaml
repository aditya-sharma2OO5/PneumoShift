# Cross-Domain Evaluation Configuration: CheXpert Uncertainty Policy Ablation (U-Zeros vs U-Ones vs U-Ignore)
experiment_name: "uncertainty_ablation"
project_name: "PneumoShift"
seed: 42
seeds: [42, 1337, 2024]

# CheXpert uncertainty training policies to evaluate
policies:
  - name: "u_zeros"
    checkpoint_path: "results/runs/chexpert_densenet121_uzeros/checkpoints/checkpoint_best.pt"
    description: "Uncertain findings mapped to 0 (Standard benchmark)"
  - name: "u_ones"
    checkpoint_path: "results/runs/chexpert_densenet121_uones/checkpoints/checkpoint_best.pt"
    description: "Uncertain findings mapped to 1 (Aggressive clinical screening)"
  - name: "u_ignore"
    checkpoint_path: "results/runs/chexpert_densenet121_uignore/checkpoints/checkpoint_best.pt"
    description: "Uncertain findings masked out of loss gradients"

source_dataset: "chexpert"
target_dataset: "nih"
shift_direction: "chexpert_to_nih"

# Target Dataset (NIH ChestX-ray14) for evaluating transferred behavior
target_data:
  dataset_name: "nih"
  data_dir: "data/nih_cxr"
  images_dir: "data/nih_cxr/images"
  splits_dir: "data/splits/nih"
  test_split: "test"
  target_cal_split: "target_cal"
  image_size: 224
  channels: 3
  batch_size: 64
  num_workers: 4
  use_frontal_only: true
  drop_lateral: true
  uncertainty_policy: "binary"
  eval_uncertainty_modes:
    - "uncertain_as_negative"
  shared_classes:
    - "Atelectasis"
    - "Cardiomegaly"
    - "Consolidation"
    - "Edema"
    - "Pleural Effusion"
    - "Pneumonia"
    - "Pneumothorax"
    - "No Finding"
  headline_target: "Pneumonia"
  headline_only: false

# Cross-Domain Uncertainty Evaluation Protocol
eval_protocol:
  bootstrap_samples: 1000
  confidence_level: 0.95
  fdr_alpha: 0.05
  ece_bins: 15
  ece_strategies:
    - "uniform"
    - "adaptive"
  run_temperature_scaling: true
  run_oracle_recalibration: true
  target_calibration_ratio: 0.10
  threshold_metrics:
    - "youden"
    - "f1"
    - "sens90"
  fixed_sensitivity_target: 0.90
  fixed_specificity_target: 0.90
  quantify_overconfidence: true
  quantify_threshold_collapse: true

# Publication Tables and Figure Output Destinations
outputs:
  output_dir: "results/tables/cross_domain/uncertainty_ablation"
  figures_dir: "results/figures/cross_domain/uncertainty_ablation"

